<!DOCTYPE html> 
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Malé město 2.1</title>
<style>
body {
    background:#1f1f1f;
    color:#eee;
    font-family:sans-serif;
    text-align:center;
}
button {
    margin:4px;
    padding:8px 12px;
    font-size:14px;
    cursor:pointer;
}
#panel {
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}
.box {
    border:1px solid #555;
    padding:10px;
    width:190px;
}
.log {
    margin-top:15px;
    height:150px;
    overflow:auto;
    border:1px solid #444;
    padding:8px;
    font-size:13px;
}
</style>
</head>
<body>

<h1>🏙️ Malé město 2.1</h1>
<p>Vyváženější simulace města</p>

<div id="panel">
<div class="box">
<b>Rok</b><div id="year"></div>
👥 Obyvatelé<div id="people"></div>
😊 Spokojenost<div id="happiness"></div>
</div>
<div class="box">
💰 Peníze<div id="money"></div>
⚡ Energie<div id="energy"></div>
📚 Vzdělání<div id="education"></div>
</div>
<div class="box">
💼 Daně<div id="tax"></div>
🏥 Nemocnice<div id="hospital"></div>
</div>
</div>

<h3>Budovy</h3>
<button onclick="build('house')">🏠 Dům (100)</button>
<button onclick="build('apartment')">🏢 Bytovka (220)</button>
<button onclick="build('plant')">⚡ Elektrárna (150)</button>
<button onclick="build('solar')">☀️ Solární park (180)</button>
<button onclick="build('factory')">🏭 Továrna (250)</button>
<button onclick="build('park')">🌳 Park (80)</button>
<button onclick="build('hospital')">🏥 Nemocnice (300)</button>
<button onclick="build('school')">🎓 Škola (200)</button>

<h3>Ovládání</h3>
<button onclick="changeTax(-5)">➖ Daně</button>
<button onclick="changeTax(5)">➕ Daně</button>
<button onclick="nextYear()">⏭️ Další rok</button>

<div class="log" id="log"></div>

<script>
let year = 1;
let people = 12, happiness = 70, money = 600;
let tax = 10, education = 0, hospitals = 0;

let energy = 0;
let energyProduction = 0;
let energyConsumption = 0;

const yearEl = document.getElementById("year");
const peopleEl = document.getElementById("people");
const happinessEl = document.getElementById("happiness");
const moneyEl = document.getElementById("money");
const energyEl = document.getElementById("energy");
const educationEl = document.getElementById("education");
const taxEl = document.getElementById("tax");
const hospitalEl = document.getElementById("hospital");

function log(t){
    const l = document.getElementById("log");
    l.innerHTML += t + "<br>";
    l.scrollTop = l.scrollHeight;
}

function update(){
    yearEl.textContent = year;
    peopleEl.textContent = people;
    happinessEl.textContent = happiness + "%";
    moneyEl.textContent = money;
    energyEl.textContent = energy + " ⚡";
    educationEl.textContent = education;
    taxEl.textContent = tax + "%";
    hospitalEl.textContent = hospitals;
}

function build(type){
    const b = {
        house:{c:100, p:5, h:-2, ec:2},
        apartment:{c:220, p:12, h:-4, ec:5},
        plant:{c:150, e:30, h:-5},
        solar:{c:180, e:20, h:+2},
        factory:{c:250, ec:8, h:-8},
        park:{c:80, h:+10},
        hospital:{c:300, hos:1, ec:6, h:+5},
        school:{c:200, edu:5, ec:4, h:+2}
    }[type];

    if(money < b.c){
        log("❌ Málo peněz");
        return;
    }

    money -= b.c;
    people += b.p || 0;
    happiness += b.h || 0;
    education += b.edu || 0;
    hospitals += b.hos || 0;

    energyProduction += b.e || 0;
    energyConsumption += b.ec || 0;

    log("🏗️ Postavena budova");
    update();
}

function event(){
    const events = [
        ()=>{ log("🎉 Kulturní festival"); happiness += 10; },
        ()=>{ log("🌵 Sucho"); money -= 80; happiness -= 5; },
        ()=>{ log("🤒 Epidemie"); happiness -= 15; people -= hospitals ? 2 : 6; },
        ()=>{ log("💹 Ekonomický boom"); money += 150; },
        ()=>{ log("🤖 Technologický průlom"); education += 5; money += 50; },
        ()=>{ log("⚠️ Blackout"); energy -= 10; happiness -= 5; }
    ];

    if(Math.random() < 0.6){
        events[Math.floor(Math.random() * events.length)]();
    }
}

function nextYear(){
    year++;

    money += people * tax + education * 2;

    energy = energyProduction - (energyConsumption + people);

    if(energy < 0){
        happiness -= 8;
        log("⚡ Nedostatek energie ve městě");
    }

    if(happiness > 85) people += 2;
    if(happiness < 40) people -= 2;

    happiness -= tax * 0.2;

    event();

    happiness = Math.max(0, Math.min(100, happiness));
    people = Math.max(0, people);

    if(people <= 0 || happiness <= 0){
        alert("Město zaniklo v roce " + year);
        location.reload();
    }

    log("📅 Konec roku " + year);
    update();
}

function changeTax(v){
    tax = Math.max(0, Math.min(50, tax + v));
    update();
}

update();
log("🏁 Vítej ve městě");
</script>

</body>
</html>
