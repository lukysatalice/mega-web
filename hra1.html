<!DOCTYPE html> 
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Malé město 2.4</title>

<style>
body{
background:#1f1f1f;
color:#eee;
font-family:sans-serif;
text-align:center;
}

button{
margin:4px;
padding:8px 12px;
font-size:14px;
cursor:pointer;
}

#panel{
display:flex;
justify-content:center;
gap:20px;
margin-top:15px;
}

.box{
border:1px solid #555;
padding:10px;
width:190px;
}

#shop{
display:none;
}

.log{
margin-top:15px;
height:150px;
overflow:auto;
border:1px solid #444;
padding:8px;
font-size:13px;
}
</style>
</head>

<body>

<h1>🏙️ Malé město 2.4</h1>

<div id="panel">

<div class="box">
<b>Rok</b><div id="year"></div>
👥 Obyvatelé<div id="people"></div>
😊 Spokojenost<div id="happiness"></div>
🌍 Turisté<div id="tourists"></div>
</div>

<div class="box">
💰 Peníze<div id="money"></div>
⚡ Energie<div id="energy"></div>
📚 Vzdělání<div id="education"></div>
</div>

<div class="box">
💼 Daně<div id="tax"></div>
🏥 Nemocnice<div id="hospital"></div>

<br><br>

<button onclick="toggleShop()">🛒 Obchod</button>

<div id="shop">
<hr>
<b>🛍️ Nakupování</b><br>
<button onclick="buy('ad')">📢 Reklama (+5 lidí) 120</button>
<button onclick="buy('energy')">🔋 Baterie +20 energie 100</button>
<button onclick="buy('grant')">🏦 Dotace +200 peněz 150</button>
<button onclick="buy('happy')">🎉 Festival +15 spokojenost 90</button>
</div>
</div>

</div>

<h3>Budovy</h3>

<button onclick="build('house')">🏠 Dům (100)</button>
<button onclick="build('apartment')">🏢 Bytovka (220)</button>
<button onclick="build('plant')">⚡ Elektrárna (150)</button>
<button onclick="build('solar')">☀️ Solární park (180)</button>
<button onclick="build('factory')">🏭 Továrna (250)</button>
<button onclick="build('park')">🌳 Park (80)</button>
<button onclick="build('hospital')">🏥 Nemocnice (300)</button>
<button onclick="build('school')">🎓 Škola (200)</button>

<!-- TURISMUS -->
<button onclick="build('hotel')">🏨 Hotel (500)</button>
<button onclick="build('resort')">🏝️ Resort (1000)</button>
<button onclick="build('airport')">✈️ Letiště (10000)</button>

<h3>Ovládání</h3>

<button onclick="changeTax(-5)">➖ Daně</button>
<button onclick="changeTax(5)">➕ Daně</button>
<button onclick="nextYear()">⏭️ Další rok</button>

<div class="log" id="log"></div>

<script>

let year=1
let people=12
let happiness=70
let money=600
let tax=10
let education=0
let hospitals=0

let tourists=5

let energy=0
let energyProduction=0
let energyConsumption=0

const yearEl=document.getElementById("year")
const peopleEl=document.getElementById("people")
const happinessEl=document.getElementById("happiness")
const moneyEl=document.getElementById("money")
const energyEl=document.getElementById("energy")
const educationEl=document.getElementById("education")
const taxEl=document.getElementById("tax")
const hospitalEl=document.getElementById("hospital")
const touristsEl=document.getElementById("tourists")

function log(t){
const l=document.getElementById("log")
l.innerHTML+=t+"<br>"
l.scrollTop=l.scrollHeight
}

function update(){
yearEl.textContent=year
peopleEl.textContent=people
happinessEl.textContent=happiness+"%"
moneyEl.textContent=money
energyEl.textContent=energy+" ⚡"
educationEl.textContent=education
taxEl.textContent=tax+"%"
hospitalEl.textContent=hospitals
touristsEl.textContent=Math.floor(tourists)
}

function toggleShop(){
const s=document.getElementById("shop")
s.style.display = s.style.display==="none" ? "block" : "none"
}

function buy(type){

const shop={
ad:{c:120},
energy:{c:100},
grant:{c:150},
happy:{c:90}
}[type]

if(money<shop.c){
log("❌ Málo peněz")
return
}

money-=shop.c

if(type==="ad"){people+=5;log("📢 Reklama přivedla nové obyvatele")}
if(type==="energy"){energyProduction+=20;log("🔋 Koupena baterie")}
if(type==="grant"){money+=200;log("🏦 Dotace dorazila")}
if(type==="happy"){happiness+=15;log("🎉 Festival!")}

update()
}

function build(type){

const b={
house:{c:100,p:5,h:-2,ec:2},
apartment:{c:220,p:12,h:-4,ec:5},
plant:{c:150,e:30,h:-5},
solar:{c:180,e:20,h:+2},
factory:{c:250,ec:8,h:-8},
park:{c:80,h:+10},
hospital:{c:300,hos:1,ec:6,h:+5},
school:{c:200,edu:5,ec:4,h:+2},

hotel:{c:500,t:0.1},
resort:{c:1000,t:0.2},
airport:{c:10000,t:0.5,h:-5,ec:15}

}[type]

if(money<b.c){
log("❌ Málo peněz")
return
}

money-=b.c
people+=b.p||0
happiness+=b.h||0
education+=b.edu||0
hospitals+=b.hos||0

energyProduction+=b.e||0
energyConsumption+=b.ec||0

if(b.t){
tourists += tourists * b.t
log("🌍 Turistický ruch vzrostl")
}

log("🏗️ Postavena budova")
update()
}

function nextYear(){

year++

money+=people*tax+education*2

// turisté vydělávají
money+=Math.floor(tourists*5)

energy=energyProduction-(energyConsumption+people)

if(energy<0){
happiness-=8
log("⚡ Nedostatek energie")
}

// růst turistů
if(happiness>70) tourists+=3
if(happiness<40) tourists-=2

if(happiness>85)people+=2
if(happiness<40)people-=2

happiness-=tax*0.2

tourists=Math.max(0,tourists)

event()

happiness=Math.max(0,Math.min(100,happiness))
people=Math.max(0,people)

if(people<=0||happiness<=0){
alert("Město zaniklo v roce "+year)
location.reload()
}

log("📅 Konec roku "+year)
update()
}

function event(){

const events=[
()=>{log("🎉 Festival");happiness+=10;tourists+=5},
()=>{log("🌵 Sucho");money-=80;happiness-=5},
()=>{log("🤒 Epidemie");happiness-=15;people-=hospitals?2:6},
()=>{log("💹 Boom");money+=150},
()=>{log("✈️ Turistický boom");tourists+=10},
()=>{log("⚠️ Blackout");energy-=10;happiness-=5}
]

if(Math.random()<0.6){
events[Math.floor(Math.random()*events.length)]()
}

}

function changeTax(v){
tax=Math.max(0,Math.min(50,tax+v))
update()
}

update()
log("🏁 Vítej ve městě")

</script>

</body>
</html>
