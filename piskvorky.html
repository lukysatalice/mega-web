<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Piškvorky 10×10 AI Pro</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Segoe UI;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:white;}
.container{text-align:center;}
h1{font-size:36px;margin-bottom:10px;text-shadow: 0 0 10px #00ffa6;}
.board{display:grid;grid-template-columns:repeat(10,60px);grid-template-rows:repeat(10,60px);gap:6px;margin:20px auto;}
.cell{background:rgba(255,255,255,0.05);border-radius:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:0.15s;border: 1px solid rgba(255,255,255,0.1);}
.cell:hover{transform:scale(1.05);background:rgba(0,255,166,0.1);}
svg{width:35px;height:35px;}
line,circle{stroke:white;stroke-width:8;fill:none;stroke-linecap:round;}
.status{font-size:22px;margin-top:5px;font-weight:bold;color:#00ffa6;}
.score{margin-top:10px;font-size:18px;}
button{margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#00ffa6;color:#1a1a2e;cursor:pointer;font-size:16px;font-weight:bold;transition:0.2s;}
button:hover{transform:scale(1.1);box-shadow: 0 0 15px #00ffa6;}
@keyframes drawX{from{stroke-dashoffset:80;}to{stroke-dashoffset:0;}}
@keyframes drawO{from{stroke-dashoffset:188.5;}to{stroke-dashoffset:0;}}
</style>
</head>
<body>
<div class="container">
<h1>Piškvorky 10×10 (4 v řadě)</h1>
<div class="board" id="board"></div>
<div class="status" id="status">Jsi na tahu (X)</div>
<div class="score">
Hráč: <span id="pScore">0</span> | AI: <span id="aScore">0</span> | Remízy: <span id="dScore">0</span>
</div>
<button onclick="restart()">Nové kolo</button>
</div>

<script>
const size = 10, need = 4;
let board = Array(size*size).fill("");
let gameActive = true;
let player = "X", ai = "O";
let pScore = 0, aScore = 0, dScore = 0;

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const pScoreEl = document.getElementById("pScore");
const aScoreEl = document.getElementById("aScore");
const dScoreEl = document.getElementById("dScore");

function drawX(){ 
  return `<svg viewBox="0 0 100 100"><line x1="25" y1="25" x2="75" y2="75" style="stroke-dasharray:80;stroke-dashoffset:80;animation:drawX 0.3s forwards;"/><line x1="75" y1="25" x2="25" y2="75" style="stroke-dasharray:80;stroke-dashoffset:80;animation:drawX 0.3s forwards;"/></svg>`;
}

function drawO(){ 
  const r = 30; const c = 2*Math.PI*r;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" style="stroke:#00ffa6;stroke-dasharray:${c};stroke-dashoffset:${c};animation:drawO 0.3s forwards;"/></svg>`;
}

function createBoard(){
  boardEl.innerHTML="";
  board.forEach((v,i)=>{
    let cell=document.createElement("div");
    cell.className="cell";
    cell.onclick=()=>playerMove(i);
    if(v==="X")cell.innerHTML=drawX();
    if(v==="O")cell.innerHTML=drawO();
    boardEl.appendChild(cell);
  });
}

function playerMove(i){
  if(!gameActive || board[i]!="") return;
  board[i]=player;
  createBoard();
  if(checkEnd()) return;
  statusEl.textContent = "AI přemýšlí...";
  setTimeout(aiMove, 300);
}

// --- VYLEPŠENÁ AI LOGIKA ---

function aiMove(){
    let bestScore = -Infinity;
    let move = -1;

    // Najdi nejlepší tah pomocí bodování
    for(let i=0; i<board.length; i++){
        if(board[i] === ""){
            let score = evaluateMove(i);
            if(score > bestScore){
                bestScore = score;
                move = i;
            }
        }
    }

    if(move !== -1){
        board[move] = ai;
        createBoard();
        if(!checkEnd()) statusEl.textContent = "Tvá řada (X)";
    }
}

function evaluateMove(index) {
    let totalScore = 0;
    const x = index % size;
    const y = Math.floor(index / size);
    
    const directions = [[1,0], [0,1], [1,1], [1,-1]];
    
    for (let [dx, dy] of directions) {
        totalScore += scoreDirection(x, y, dx, dy, ai);     // Body pro AI (útok)
        totalScore += scoreDirection(x, y, dx, dy, player) * 0.9; // Body pro blokování hráče (obrana)
    }
    
    // Malý bonus za střed pole
    const distToCenter = Math.abs(x - 4.5) + Math.abs(y - 4.5);
    totalScore += (10 - distToCenter) * 0.1;

    return totalScore;
}

function scoreDirection(x, y, dx, dy, p) {
    let count = 0;
    let openEnds = 0;
    
    // Kontrola obou směrů
    for (let side of [-1, 1]) {
        for (let step = 1; step < need; step++) {
            let nx = x + dx * step * side;
            let ny = y + dy * step * side;
            
            if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
                if (board[ny * size + nx] === p) {
                    count++;
                } else if (board[ny * size + nx] === "") {
                    openEnds++;
                    break;
                } else {
                    break;
                }
            } else {
                break;
            }
        }
    }

    // Bodovací tabulka
    if (count >= 3) return 10000; // Výherní tah / Kritický blok
    if (count === 2) return openEnds === 2 ? 1000 : 100; // Trojice
    if (count === 1) return openEnds === 2 ? 50 : 10;   // Dvojice
    return 0;
}

// --- STANDARDNÍ FUNKCE ---

function get(x,y){if(x<0||y<0||x>=size||y>=size)return null; return board[y*size+x];}

function checkWinner(){
  for(let y=0;y<size;y++)
    for(let x=0;x<size;x++){
      let p=get(x,y); if(!p) continue;
      let dirs=[[1,0],[0,1],[1,1],[1,-1]];
      for(let d of dirs){
        let ok=true;
        for(let i=0;i<need;i++){if(get(x+d[0]*i,y+d[1]*i)!=p){ok=false; break;}}
        if(ok) return p;
      }
    }
  if(board.every(c=>c!="")) return "draw";
  return null;
}

function checkEnd(){
  let w=checkWinner();
  if(!w) return false;
  gameActive=false;
  if(w=="draw"){statusEl.textContent="Remíza 🤝"; dScore++; dScoreEl.textContent=dScore;}
  else if(w==player){statusEl.textContent="Vyhrál jsi! 🏆"; pScore++; pScoreEl.textContent=pScore;}
  else{statusEl.textContent="AI tě porazila! 🤖"; aScore++; aScoreEl.textContent=aScore;}
  return true;
}

function restart(){
  board=Array(size*size).fill("");
  gameActive=true;
  statusEl.textContent="Jsi na tahu (X)";
  createBoard();
}

createBoard();
</script>
</body>
</html>
