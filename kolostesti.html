<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rychlé Kolo štěstí</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .wheel-box {
            position: relative;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
            background-color: white;
        }
        #arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.1s, background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        button:active {
            transform: scale(0.98);
        }
        #winner {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            min-height: 35px;
        }
    </style>
</head>
<body>

    <h1>🎡 Rychlé Kolo štěstí</h1>

    <div class="container">
        <div class="wheel-box">
            <div id="arrow"></div>
            <canvas id="canvas" width="400" height="400"></canvas>
            <div id="winner"></div>
        </div>

        <div class="controls">
            <h3>Nastavení jmen</h3>
            <p>Zadej jména (každé na řádek):</p>
            <textarea id="namesList">Petr
Jana
Marek
Lucie
Honza
Ema</textarea>
            <button id="spinBtn" onclick="spin()">ZATOČIT TEĎ!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const namesInput = document.getElementById('namesList');
        const winnerDisplay = document.getElementById('winner');
        const spinBtn = document.getElementById('spinBtn');

        let names = [];
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        function drawRouletteWheel() {
            names = namesInput.value.split('\n').filter(name => name.trim() !== "");
            if (names.length === 0) {
                ctx.clearRect(0, 0, 400, 400);
                return;
            }

            const radius = 190;
            arc = Math.PI * 2 / names.length;

            ctx.clearRect(0, 0, 400, 400);

            names.forEach((name, i) => {
                const angle = startAngle + i * arc;
                ctx.fillStyle = getColor(i, names.length);

                ctx.beginPath();
                ctx.arc(200, 200, radius, angle, angle + arc, false);
                ctx.lineTo(200, 200);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(200 + Math.cos(angle + arc / 2) * (radius - 50), 
                              200 + Math.sin(angle + arc / 2) * (radius - 50));
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.font = 'bold 16px Arial';
                ctx.fillText(name, -ctx.measureText(name).width / 2, 0);
                ctx.restore();
            });
        }

        function getColor(item, maxitem) {
            const hue = item * (360 / maxitem);
            return `hsl(${hue}, 70%, 50%)`;
        }

        function spin() {
            if (spinTimeout) return;
            names = namesInput.value.split('\n').filter(name => name.trim() !== "");
            if (names.length === 0) return;

            spinBtn.disabled = true;
            winnerDisplay.innerHTML = "Točíme v plné rychlosti!";
            
            spinAngleStart = Math.random() * 20 + 25; 
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000; 
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 15;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawRouletteWheel();
            spinTimeout = setTimeout(rotateWheel, 15);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            spinTimeout = null;
            
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd);
            const winnerIdx = index % names.length;
            const winner = names[winnerIdx];
            
            winnerDisplay.innerHTML = "Vítěz: " + winner + "! 🎉";

            // ODSTRANĚNÍ VÍTĚZE:
            setTimeout(() => {
                // Odstraní jméno z pole
                const updatedNames = names.filter((_, i) => i !== winnerIdx);
                // Aktualizuje textarea
                namesInput.value = updatedNames.join('\n');
                // Překreslí kolo
                drawRouletteWheel();
                spinBtn.disabled = false;
            }, 1500); // Počká 1.5 sekundy po výhře, než vítěze smaže
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        namesInput.addEventListener('input', drawRouletteWheel);
        drawRouletteWheel();
    </script>
</body>
</html>
