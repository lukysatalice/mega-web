<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přehled konců mých her</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }
        h2 {
            color: #e67e22;
            background: #fff;
            padding: 10px;
            border-left: 5px solid #e67e22;
            margin-top: 30px;
        }
        .seznam-koncu {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .konec {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .konec:last-child {
            border-bottom: none;
        }
        .konec:hover {
            background-color: #fff9f4;
            padding-left: 5px;
        }
        /* Styl pro checkbox */
        input[type="checkbox"] {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        /* Styl pro hotový (odškrtnutý) konec */
        input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Moje Herní Konce</h1>

    <section>
        <h2>Hra 1</h2>
        <div class="seznam-koncu">
            <label class="konec"><input type="checkbox"><span>Jsi doma</span></label>
            <label class="konec"><input type="checkbox"><span>Tučná odměna</span></label>
            <label class="konec"><input type="checkbox"><span>Oženil jsi se</span></label>
            <label class="konec"><input type="checkbox"><span>Umřel jsi</span></label>
            <label class="konec"><input type="checkbox"><span>Koupaliště</span></label>
            <label class="konec"><input type="checkbox"><span>Jdeš na letadlo</span></label>
        </div>
    </section>

    <section>
        <h2>Hra 2</h2>
        <div class="seznam-koncu">
            <label class="konec"><input type="checkbox"><span>Stihl jsi letadlo</span></label>
            <label class="konec"><input type="checkbox"><span>Uletělo ti letadlo</span></label>
            <label class="konec"><input type="checkbox"><span>Jsi v Majalandu</span></label>
            <label class="konec"><input type="checkbox"><span>Letíš až zítra</span></label>
            <label class="konec"><input type="checkbox"><span>Jižní město</span></label>
            <label class="konec"><input type="checkbox"><span>Jedeš do města</span></label>
            <label class="konec"><input type="checkbox"><span>Lego</span></label>
        </div>
    </section>

</body>
</html>>
